[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epsilonmu"
version = "0.1.0"
description = "Evidence based debugging for computational physics"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
epsilonmu = "epsilonmu.cli:main"

[tool.setuptools.packages.find]
include = ["epsilonmu*"]
