[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epsilonmu"
version = "0.5.2.dev0"
description = "Evidence based debugging for computational physics"
requires-python = ">=3.10"
dependencies = ["sympy>=1.12,<2"]

[project.optional-dependencies]
test = ["pytest>=7"]
credentials = ["keyring>=24"]

[project.scripts]
epsilonmu = "epsilonmu.cli:main"

[tool.setuptools.packages.find]
include = ["epsilonmu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
